[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "usta"
dynamic = ["version"]
authors = [
  { name="Sedat Ayma" },
]
description = "High-performance, PySide6-based instant translation HUD for Linux."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = [
    "PySide6>=6.5.0",
    "pytesseract>=0.3.10",
    "easyocr>=1.7.0",
    "rapidocr-onnxruntime>=1.2.0,<1.3.0",
    "onnxruntime>=1.17.0",
    "deepl>=1.0.0",
    "pynput>=1.7.6",
    "googletrans==4.0.2",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
    "dbus-next>=0.2.3",
    "Babel>=2.12.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
]

[project.urls]
"Homepage" = "https://github.com/sedataym/usta"
"Bug Tracker" = "https://github.com/sedataym/usta/issues"

[project.scripts]
usta = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src" = ["translations/*/LC_MESSAGES/*.mo"]
"src.ui" = ["assets/*.png"]

[project.optional-dependencies]
paddle = ["paddleocr>=3.6.0", "paddlepaddle"]
dev = ["ruff", "mypy", "build", "coverage"]

[tool.setuptools.dynamic]
version = {attr = "src._version.__version__"}
